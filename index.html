<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quel utilisateur d'IA es-tu ? — Autopositionnement</title>
  <style>
    :root {
      --retro-teal: #7ec0c8;
      --retro-orange: #ea4e86;
      --retro-jaune: #efb243;
      --retro-ink: #3d3938;
      --retro-paper: #f5f5f5;
    }

    * {
      box-sizing: border-box;
      transition: border-color 0.2s, background-color 0.2s, color 0.2s;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: var(--retro-ink);
      background: var(--retro-ink) url('background.jpg') center center / cover no-repeat fixed;
      padding: 16px;
      min-height: 100vh;
      line-height: 1.5;
    }

    .page-frame {
      background: var(--retro-paper);
      border: 4px solid var(--retro-orange);
      border-radius: 32px 8px 24px 12px;
      position: relative;
      min-height: calc(100vh - 32px);
      padding: 40px;
      max-width: 860px;
      margin: 0 auto;
    }

    h1,
    h2,
    h3,
    .titre {
      font-family: Impact, 'Arial Black', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--retro-teal);
      margin: 0 0 12px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.15;
    }

    h2 {
      font-size: 22px;
    }

    .surtitre {
      font-family: Impact, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--retro-orange);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .intro-text {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(13, 22, 23, 0.85);
    }

    .ecran {
      animation: fadeSlideIn 0.35s ease both;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hidden {
      display: none !important;
    }

    /* Progress bar */
    .progress-bar-container {
      height: 6px;
      background: rgba(18, 118, 118, 0.15);
      border-radius: 3px;
      margin-bottom: 16px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--retro-teal), var(--retro-orange));
      border-radius: 3px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .progress-label {
      font-family: Impact, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 11px;
      color: var(--retro-teal);
      margin-bottom: 24px;
      text-align: right;
    }

    /* Section header */
    .section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--retro-teal);
    }

    .section-emoji {
      font-size: 36px;
      flex-shrink: 0;
    }

    .section-titre {
      margin: 0;
      font-size: 22px;
    }

    .section-sous-titre {
      font-size: 13px;
      color: rgba(13, 22, 23, 0.6);
      margin: 4px 0 0;
      font-style: italic;
    }

    /* Separator */
    .separateur {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
      color: var(--retro-teal);
      font-size: 20px;
    }

    .separateur::before,
    .separateur::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--retro-teal), transparent);
    }

    /* Question card */
    .carte-question {
      background: var(--retro-paper);
      border: 3px solid var(--retro-teal);
      border-radius: 24px 8px 24px 8px;
      box-shadow: inset 0 0 0 1px rgba(228, 99, 46, 0.15);
      padding: 24px 28px;
      margin-bottom: 20px;
    }

    .q-num {
      display: inline-block;
      font-family: Impact, sans-serif;
      background: var(--retro-orange);
      color: var(--retro-paper);
      padding: 3px 10px;
      border-radius: 12px 4px 12px 4px;
      font-size: 13px;
      letter-spacing: 0.1em;
      margin-right: 8px;
    }

    .q-text {
      font-weight: 600;
      margin: 0 0 16px;
      font-size: 16px;
      line-height: 1.45;
    }

    .q-help {
      font-size: 13px;
      color: rgba(13, 22, 23, 0.65);
      font-style: italic;
      margin: -8px 0 14px;
    }

    /* Options */
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 16px;
      border: 2px solid transparent;
      border-radius: 12px 4px 12px 4px;
      cursor: pointer;
      background: rgba(18, 118, 118, 0.03);
    }

    .option:hover {
      border-color: var(--retro-jaune);
      background: rgba(227, 165, 53, 0.08);
    }

    .option.selected {
      border-color: var(--retro-teal);
      background: rgba(18, 118, 118, 0.08);
    }

    .option-lettre {
      min-width: 28px;
      height: 28px;
      background: var(--retro-teal);
      color: var(--retro-paper);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Impact, sans-serif;
      font-size: 13px;
      flex-shrink: 0;
    }

    .option.selected .option-lettre {
      background: var(--retro-orange);
    }

    .option-text {
      font-size: 14.5px;
      line-height: 1.45;
    }

    .option input {
      display: none;
    }

    /* Likert */
    .likert-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 12px 0;
      flex-wrap: wrap;
    }

    .likert-option {
      width: 52px;
      height: 52px;
      border: 3px solid var(--retro-teal);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Impact, sans-serif;
      font-size: 20px;
      cursor: pointer;
      color: var(--retro-teal);
      background: var(--retro-paper);
    }

    .likert-option:hover {
      background: var(--retro-jaune);
      border-color: var(--retro-jaune);
      color: var(--retro-ink);
    }

    .likert-option.selected {
      background: var(--retro-teal);
      color: var(--retro-paper);
    }

    .likert-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(13, 22, 23, 0.6);
      padding: 4px 8px;
      font-style: italic;
    }

    /* Textarea */
    textarea {
      width: 100%;
      min-height: 90px;
      border: 2px solid var(--retro-teal);
      border-radius: 12px 4px 12px 4px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14.5px;
      background: var(--retro-paper);
      color: var(--retro-ink);
      resize: vertical;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: var(--retro-orange);
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: stretch;
      border: 3px solid var(--retro-teal);
      border-radius: 50px;
      overflow: hidden;
      cursor: pointer;
      font-family: Impact, 'Arial Black', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: none;
      padding: 0;
      margin-top: 16px;
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary .btn-label {
      background: var(--retro-jaune);
      color: var(--retro-ink);
      padding: 12px 20px;
      font-size: 14px;
      display: flex;
      align-items: center;
    }

    .btn-primary .btn-icon {
      background: var(--retro-orange);
      color: var(--retro-paper);
      padding: 12px 18px;
      font-size: 18px;
      display: flex;
      align-items: center;
    }

    .btn-primary:hover:not(:disabled) .btn-label {
      background: var(--retro-orange);
      color: var(--retro-paper);
    }

    .btn-primary:hover:not(:disabled) .btn-icon {
      background: var(--retro-teal);
    }

    .btn-secondary {
      display: inline-block;
      border: 2px solid var(--retro-teal);
      background: transparent;
      color: var(--retro-teal);
      padding: 10px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-family: Impact, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 13px;
      margin: 4px;
    }

    .btn-secondary:hover {
      background: var(--retro-teal);
      color: var(--retro-paper);
    }

    .button-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    /* Consent box */
    .consent-box {
      background: rgba(18, 118, 118, 0.06);
      border: 2px dashed var(--retro-teal);
      border-radius: 16px 4px 16px 4px;
      padding: 24px;
      margin: 24px 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .consent-box ul {
      margin: 8px 0;
      padding-left: 20px;
    }

    .consent-box li {
      margin-bottom: 6px;
    }

    .consent-box strong {
      color: var(--retro-teal);
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 18px 0;
      cursor: pointer;
      font-size: 14.5px;
      user-select: none;
    }

    .checkbox-row input {
      display: none;
    }

    .checkbox-custom {
      width: 22px;
      height: 22px;
      border: 2.5px solid var(--retro-teal);
      border-radius: 6px 2px 6px 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--retro-paper);
    }

    .checkbox-row input:checked+.checkbox-custom {
      background: var(--retro-orange);
      border-color: var(--retro-orange);
    }

    .checkbox-row input:checked+.checkbox-custom::after {
      content: '✓';
      color: var(--retro-paper);
      font-weight: bold;
      font-size: 15px;
    }

    /* Report screen */
    .rapport-columns {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 32px;
      margin-top: 16px;
    }

    .col-gauche {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .scores-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .score-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .score-row-head {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .score-row-head .nom {
      font-family: Impact, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--retro-teal);
    }

    .score-row-head .val {
      font-family: Impact, sans-serif;
      color: var(--retro-orange);
    }

    .score-bar-bg {
      height: 8px;
      background: rgba(18, 118, 118, 0.12);
      border-radius: 4px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--retro-teal), var(--retro-orange));
      border-radius: 4px;
    }

    .badges {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .badge {
      padding: 12px 16px;
      border-radius: 16px 4px 16px 4px;
      font-size: 13px;
      border: 2px solid;
    }

    .badge-titre {
      font-family: Impact, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
    }

    .badge-dom {
      border-color: var(--retro-teal);
      background: rgba(18, 118, 118, 0.08);
    }

    .badge-dom .badge-titre {
      color: var(--retro-teal);
    }

    .badge-ang {
      border-color: var(--retro-orange);
      background: rgba(228, 99, 46, 0.08);
    }

    .badge-ang .badge-titre {
      color: var(--retro-orange);
    }

    .rapport-container {
      background: var(--retro-ink);
      color: var(--retro-paper);
      border-radius: 24px 8px 24px 8px;
      padding: 32px 36px;
      border: 2px solid var(--retro-orange);
      max-height: 70vh;
      overflow-y: auto;
    }

    .rapport-container h2 {
      font-family: Impact, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--retro-jaune);
      font-size: 17px;
      margin: 24px 0 8px;
      border-bottom: 1px solid rgba(227, 165, 53, 0.3);
      padding-bottom: 6px;
    }

    .rapport-container h2:first-child {
      margin-top: 0;
    }

    .rapport-container h3 {
      color: var(--retro-teal);
      font-family: Impact, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 14px;
      margin: 16px 0 6px;
    }

    .rapport-container p {
      line-height: 1.7;
      color: rgba(242, 239, 230, 0.92);
      margin: 0 0 12px;
      font-size: 14.5px;
    }

    .rapport-container ul {
      padding-left: 20px;
      margin: 8px 0 14px;
    }

    .rapport-container li {
      margin-bottom: 6px;
      line-height: 1.6;
      color: rgba(242, 239, 230, 0.92);
      font-size: 14.5px;
    }

    .rapport-container strong {
      color: var(--retro-jaune);
    }

    .rapport-container em {
      color: rgba(242, 239, 230, 0.75);
    }

    /* SVG radar */
    .radar-wrap {
      display: flex;
      justify-content: center;
    }

    .radar-wrap svg {
      width: 100%;
      max-width: 360px;
      height: auto;
    }

    .radar-label {
      font-family: Impact, sans-serif;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.08em;
      fill: var(--retro-teal);
    }

    /* Print */
    @media print {
      body {
        background: white;
        padding: 0;
      }

      .page-frame {
        border: none;
        box-shadow: none;
        padding: 0;
      }

      .no-print {
        display: none !important;
      }

      .rapport-container {
        background: white;
        color: black;
        border: 2px solid var(--retro-teal);
        max-height: none;
        overflow: visible;
      }

      .rapport-container h2 {
        color: var(--retro-teal);
        border-color: var(--retro-teal);
      }

      .rapport-container p,
      .rapport-container li {
        color: black;
      }

      .rapport-container strong {
        color: var(--retro-orange);
      }

      .rapport-columns {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 8px;
      }

      .page-frame {
        padding: 22px 18px;
        min-height: calc(100vh - 16px);
      }

      h1 {
        font-size: 24px;
      }

      .rapport-columns {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .likert-option {
        width: 44px;
        height: 44px;
        font-size: 16px;
      }

      .section-header {
        gap: 12px;
      }

      .section-emoji {
        font-size: 28px;
      }

      .section-titre {
        font-size: 18px;
      }

      .carte-question {
        padding: 18px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="page-frame">
    <div id="app"></div>
  </div>

  <script>
    /* ==========================================================
       CONFIGURATION
       ========================================================== */
    const CONFIG = {
      NOM_FORMATEUR: '[À COMPLÉTER]',
      EMAIL_CONTACT: '[À COMPLÉTER]',
      VERSION: '3.0',
      DATE: '2026'
    };

    /* ==========================================================
       STRUCTURE DU QUESTIONNAIRE
       ========================================================== */
    const ENJEUX = [
      { id: 'ethique', emoji: '🔵', titre: 'Éthique', sousTitre: "Responsabilité, équité, transparence : les choix que l'IA impose à l'enseignant·e", prefix: 'E' },
      { id: 'juridique', emoji: '🟢', titre: 'Juridique', sousTitre: "RGPD, AI Act, droit d'auteur : les règles qui encadrent déjà vos usages", prefix: 'J' },
      { id: 'ecologique', emoji: '🟡', titre: 'Écologique', sousTitre: "Ce que l'IA coûte à la planète — et ce que vous pouvez en faire en classe", prefix: 'Eco' },
      { id: 'esprit_critique', emoji: '🔴', titre: 'Esprit critique', sousTitre: "Hallucinations, biais, idéologies des modèles : savoir douter intelligemment", prefix: 'EC' },
      { id: 'cybersecurite', emoji: '🟠', titre: 'Cybersécurité', sousTitre: "L'IA change les règles : les anciens repères ne suffisent plus", prefix: 'CS' },
      { id: 'democratique', emoji: '🟣', titre: 'Démocratique', sousTitre: "Bulles de filtre, deepfakes politiques, manipulation de l'opinion : l'IA et la citoyenneté", prefix: 'D' },
      { id: 'geopolitique', emoji: '⚫', titre: 'Géopolitique', sousTitre: "Qui développe l'IA que vous utilisez ? À qui donnez-vous du pouvoir et de l'information ?", prefix: 'G' }
    ];

    const NOM_ENJEUX_AFFICHE = {
      ethique: 'Éthique',
      juridique: 'Juridique',
      ecologique: 'Écologique',
      esprit_critique: 'Esprit critique',
      cybersecurite: 'Cybersécurité',
      democratique: 'Démocratique',
      geopolitique: 'Géopolitique'
    };

    const QUESTIONS = {
      // ===== MISE EN ROUTE =====
      M1: {
        type: 'choix', text: "En ce moment, comment décririez-vous votre rapport à l'IA générative dans votre travail d'enseignant·e ?",
        options: [
          "Je l'évite ou je m'y oppose — par choix ou par manque de temps",
          "Je l'observe de loin — curieux·se mais pas encore utilisateur·rice",
          "Je l'expérimente — j'utilise quelques outils sans cadre défini",
          "Je l'intègre — j'ai des pratiques stables et je les questionne"
        ], score: null
      },
      M2: {
        type: 'choix', text: "Dans votre classe ou votre école, l'IA générative est actuellement un sujet...",
        options: [
          "Absent — on n'en parle pas",
          "Évité — on sait que ça existe mais on préfère ne pas ouvrir la boîte",
          "Émergent — quelques collègues ou élèves commencent à en parler",
          "Présent — il y a déjà des usages, des débats, peut-être des tensions"
        ], score: null
      },

      // ===== ÉTHIQUE =====
      E1: {
        type: 'choix', text: "Un·e collègue utilise une IA pour générer des commentaires de bulletins personnalisés pour ses 120 élèves. Il/elle ne le mentionne pas aux élèves ni aux parents. Votre réaction ?",
        options: [
          "C'est pragmatique — personne n'a besoin de savoir comment les outils sont utilisés",
          "C'est discutable — l'usage est légitime mais la transparence me semblerait préférable",
          "C'est problématique — la transparence envers les familles est une obligation déontologique",
          "C'est inacceptable — les données d'élèves ne devraient jamais alimenter une IA grand public"
        ], score: { A: 1, B: 2, C: 3, D: 4 }
      },
      E2: {
        type: 'choix', text: "L'IA peut adapter le contenu pédagogique à chaque élève (rythme, niveau, style d'apprentissage)sans que l'enseignant ne doive s'occuper de rien. Cette personnalisation vous inspire surtout...",
        options: [
          "De l'enthousiasme — c'est une promesse de différenciation enfin accessible",
          "De la prudence — elle risque de renforcer les inégalités selon l'accès aux outils",
          "De la méfiance — je ne sais pas sur quelles données ni selon quels critères elle opère",
          "Du scepticisme — la relation pédagogique ne se réduit pas à de la personnalisation algorithmique, surtout si l'enseignantt(e) ne maitrise pas les outils d'IA"
        ], score: { A: 1, B: 3, C: 3, D: 3 }
      },
      E3: {
        type: 'choix', text: "Dans votre pratique, à quelle fréquence déclarez-vous explicitement à vos élèves que vous avez utilisé une IA pour préparer un cours, un exercice ou une évaluation ?",
        options: [
          "Jamais — je n'utilise pas l'IA pour préparer mes cours",
          "Jamais — je l'utilise mais je n'en parle pas",
          "Parfois — quand ça me semble pertinent d'en faire un sujet de discussion",
          "Systématiquement — c'est un principe que je me suis fixé"
        ], score: { A: 1, B: 1, C: 3, D: 4 }, keepOrder: true
      },
      E4: {
        type: 'choix', text: "Parmi ces enjeux éthiques liés à l'IA en éducation, lequel vous préoccupe le plus ?", help: "(une seule réponse)",
        options: [
          "La délégation de décisions pédagogiques à une machine (qui note, qui oriente, qui recommande)",
          "Les biais discriminants dans les modèles (genre, origine, langue)",
          "La dépendance des élèves à l'IA au détriment de leurs propres compétences cognitives",
          "La fracture numérique entre élèves qui ont accès à l'IA et ceux qui n'y ont pas accès"
        ], score: { A: 2, B: 2, C: 2, D: 2 }
      },

       Échelles ordonnées préservées : likert (par type), non notées (score null),
       et fréquences marquées keepOrder. */
    function hashStr(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }
    function seededShuffle(n, seed) {
      const a = Array.from({ length: n }, (_, i) => i);
      let s = seed >>> 0;
      const rnd = () => {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function ordreAffichage(qid) {
      const q = QUESTIONS[qid];
      const n = q.options.length;
      const ident = Array.from({ length: n }, (_, i) => i);
      if (q.type !== 'choix' || !q.score || q.keepOrder) return ident;
      let seed = hashStr(qid), order = seededShuffle(n, seed), garde = 0;
      while (order.every((v, i) => v === i) && garde < 8) { seed = (seed + 1) >>> 0; order = seededShuffle(n, seed); garde++; }
      return order;
    }

    /* ==========================================================
       SCORING
       ========================================================== */
    function getScoreBrut(qid, reponse) {
      const q = QUESTIONS[qid];
      if (!q) return null;
      if (q.type === 'choix') {
        return q.score[reponse] ?? null;
      }
      if (q.type === 'likert') {
        if (qid === 'E5') return LIKERT_E5_MAPPING[reponse] ?? reponse;
        return reponse;
      }
      return null;
    }

    function normaliserScore(brut, q) {
      if (q.type === 'likert' && q.normalizeMax === 5 && QUESTIONS[Object.keys(QUESTIONS).find(k => QUESTIONS[k] === q)] !== QUESTIONS.E5) {
        // J5, Eco3, EC4, CS3, D2, G3 : 1→5 normalisé
        return ((brut - 1) / (5 - 1)) * 100;
      }
      // E5 a été ramené à 1→4 par le mapping → on normalise sur 1→4
      return ((brut - 1) / (4 - 1)) * 100;
    }

    function calculerScoresEnjeux() {
      for (const enjeuId in SCORED_QUESTIONS_PAR_ENJEU) {
        const ids = SCORED_QUESTIONS_PAR_ENJEU[enjeuId];
        const scoresNorm = [];
        const scoresBruts = [];
        for (const qid of ids) {
          const rep = state.reponses[qid];
          if (rep === undefined || rep === null) continue;
          const brut = getScoreBrut(qid, rep);
          if (brut === null || brut === 0) continue;
          const q = QUESTIONS[qid];
          let norm;
          if (q.type === 'likert' && qid !== 'E5') {
            norm = ((brut - 1) / (5 - 1)) * 100;
          } else {
            norm = ((brut - 1) / (4 - 1)) * 100;
          }
          scoresNorm.push(norm);
          scoresBruts.push(brut);
        }
        if (scoresNorm.length === 0) {
          state.scores_normalises[enjeuId] = 0;
          state.scores[enjeuId] = 0;
        } else {
          state.scores_normalises[enjeuId] = Math.round(scoresNorm.reduce((a, b) => a + b, 0) / scoresNorm.length);
          state.scores[enjeuId] = state.scores_normalises[enjeuId];
        }
      }
      // Profils
      const sorted = Object.entries(state.scores_normalises).sort((a, b) => b[1] - a[1]);
      state.profils_dominants = [sorted[0][0], sorted[1][0]];
      state.angles_morts = [sorted[sorted.length - 1][0], sorted[sorted.length - 2][0]];
    }

    /* ==========================================================
       RADAR SVG
       ========================================================== */
    function buildRadarSVG() {
      const ids = ['ethique', 'juridique', 'ecologique', 'esprit_critique', 'cybersecurite', 'democratique', 'geopolitique'];
      const labels = ids.map(i => NOM_ENJEUX_AFFICHE[i]);
      const values = ids.map(i => state.scores_normalises[i] || 0);
      const N = ids.length;
      const cx = 200, cy = 200, R = 140;
      const angleStep = (2 * Math.PI) / N;

      function point(i, ratio) {
        const a = -Math.PI / 2 + i * angleStep;
        return [cx + Math.cos(a) * R * ratio, cy + Math.sin(a) * R * ratio];
      }

      let webs = '';
      for (let lvl = 1; lvl <= 5; lvl++) {
        const ratio = lvl / 5;
        const pts = [];
        for (let i = 0; i < N; i++) {
          const [x, y] = point(i, ratio);
          pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
        }
        webs += `<polygon points="${pts.join(' ')}" fill="none" stroke="rgba(18,118,118,0.18)" stroke-width="1"/>`;
      }

      let axes = '';
      for (let i = 0; i < N; i++) {
        const [x, y] = point(i, 1);
        axes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(18,118,118,0.25)" stroke-width="1"/>`;
      }

      const polyPts = [];
      const dots = [];
      for (let i = 0; i < N; i++) {
        const ratio = (values[i] || 0) / 100;
        const [x, y] = point(i, ratio);
        polyPts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
        dots.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="var(--retro-orange)"/>`);
      }

      let lbls = '';
      for (let i = 0; i < N; i++) {
        const [x, y] = point(i, 1.18);
        lbls += `<text class="radar-label" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${escapeHtml(labels[i])}</text>`;
      }

      return `
    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Radar des enjeux">
      ${webs}
      ${axes}
      <polygon points="${polyPts.join(' ')}" fill="rgba(18,118,118,0.25)" stroke="var(--retro-teal)" stroke-width="2"/>
      ${dots.join('')}
      ${lbls}
    </svg>
  `;
    }

    (function buildQuizOrder() {
      const ids = [];
      for (const enjeuId in QUESTIONS_PAR_ENJEU) {
        for (const qid of QUESTIONS_PAR_ENJEU[enjeuId]) {
          if (QUESTIONS[qid].type === 'choix') ids.push(qid);
        }
      }
      for (let i = ids.length - 1; i > 0; i--) {        // Fisher-Yates
        const j = Math.floor(Math.random() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
      state.quizOrder = ids;
    })();

    render();
  </script>
